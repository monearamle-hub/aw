<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الاتصال الإنساني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E7;
    --paper-2:#EDE6D6;
    --ink:#252220;
    --ink-soft:#5C554C;
    --teal:#1F6B66;
    --teal-deep:#134744;
    --gold:#C89B3C;
    --wrong:#A8402F;
    --line:#D8CFBB;
    --card:#FBF9F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(31,107,102,0.07), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(200,155,60,0.09), transparent 45%);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 60px;
  }
  .brand{
    text-align:center;
    margin-bottom:28px;
    max-width:640px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:var(--teal-deep);
    font-weight:900;
    font-size:13px;
    letter-spacing:0.02em;
    margin-bottom:10px;
  }
  .brand .mark svg{width:20px;height:20px;}
  .brand h1{
    font-family:'Amiri', serif;
    font-size:clamp(28px,4.5vw,40px);
    font-weight:700;
    margin:0 0 8px;
    color:var(--ink);
    line-height:1.25;
  }
  .brand p{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
    line-height:1.7;
  }

  .stage{width:100%;max-width:640px;}

  /* ---------- Setup screen ---------- */
  .setup-card{
    background:var(--card);
    border:1px solid var(--line);
    padding:28px 26px;
  }
  .setup-card h2{
    font-family:'Amiri', serif;
    font-size:20px;
    margin:0 0 4px;
  }
  .setup-card .hint{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 20px;
  }
  .chapter-list{
    display:flex;
    flex-direction:column;
    gap:0;
    border-top:1px solid var(--line);
  }
  .chapter-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .chapter-item .ch-name{
    font-size:15px;
    font-weight:500;
    line-height:1.5;
  }
  .chapter-item .ch-count{
    flex:none;
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .chapter-item .ch-check{
    flex:none;
    width:18px;height:18px;
    border:1.5px solid var(--ink-soft);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .chapter-item.checked .ch-check{
    background:var(--teal);
    border-color:var(--teal);
  }
  .chapter-item.checked .ch-check svg{display:block;}
  .ch-check svg{display:none;width:11px;height:11px;stroke:white;}

  .setup-actions{
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .count-note{font-size:13px;color:var(--ink-soft);}
  .btn{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    cursor:pointer;
    padding:13px 26px;
    background:var(--teal-deep);
    color:var(--paper);
    transition:background .15s;
  }
  .btn:hover{background:var(--teal);}
  .btn:disabled{background:#B9B2A2;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--teal-deep);
    border:1.5px solid var(--teal-deep);
    padding:11px 24px;
  }
  .btn-ghost:hover{background:rgba(31,107,102,0.08);}

  /* ---------- Quiz screen ---------- */
  .quiz-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-track{
    height:3px;
    background:var(--line);
    width:100%;
    margin-bottom:22px;
    position:relative;
  }
  .progress-fill{
    position:absolute;
    inset:0;
    background:var(--teal);
    width:0%;
    transition:width .35s ease;
  }

  .q-card{
    background:var(--card);
    border:1px solid var(--line);
    padding:30px 26px 26px;
  }
  .q-topline{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .q-chapter{
    font-size:13px;
    color:var(--teal-deep);
    font-weight:700;
  }
  .hint-btn{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Tajawal', sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
    background:transparent;
    border:1.5px solid var(--gold);
    padding:6px 12px;
    cursor:pointer;
    transition:background .12s, opacity .12s;
  }
  .hint-btn:hover:not(:disabled){background:rgba(200,155,60,0.12);}
  .hint-btn:disabled{
    opacity:0.4;
    cursor:default;
  }
  .hint-btn svg{width:15px;height:15px;}
  .hint-note{
    font-size:13px;
    color:var(--gold);
    font-weight:700;
    margin:-8px 0 16px;
    display:none;
  }
  .hint-note.show{display:block;}
  .q-text{
    font-family:'Amiri', serif;
    font-size:clamp(19px,3vw,22px);
    line-height:1.6;
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    text-align:right;
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    line-height:1.5;
    padding:14px 16px;
    border:1.5px solid var(--line);
    background:var(--paper);
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:12px;
    transition:border-color .12s, background .12s;
  }
  .opt:hover:not(.locked){border-color:var(--teal);background:#F3EFE1;}
  .opt .bullet{
    flex:none;
    width:20px;height:20px;
    border:1.5px solid var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .opt.correct{border-color:var(--teal);background:rgba(31,107,102,0.12);}
  .opt.correct .bullet{background:var(--teal);border-color:var(--teal);color:#fff;}
  .opt.wrong{border-color:var(--wrong);background:rgba(168,64,47,0.10);}
  .opt.wrong .bullet{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .opt.locked{cursor:default;}
  .opt.dim{opacity:0.55;}

  .feedback{
    margin-top:18px;
    font-size:14px;
    font-weight:700;
    display:none;
    align-items:center;
    gap:8px;
  }
  .feedback.show{display:flex;}
  .feedback.ok{color:var(--teal-deep);}
  .feedback.bad{color:var(--wrong);}

  .q-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .score-note{font-size:13px;color:var(--ink-soft);}
  .next-btn{display:none;}
  .next-btn.show{display:inline-block;}

  /* ---------- Result screen ---------- */
  .result-card{
    background:var(--card);
    border:1px solid var(--line);
    padding:34px 28px;
    text-align:center;
  }
  .result-card .big-score{
    font-family:'Amiri', serif;
    font-size:56px;
    font-weight:700;
    color:var(--teal-deep);
    line-height:1;
    margin-bottom:6px;
  }
  .result-card .big-score span{font-size:24px;color:var(--ink-soft);font-family:'Tajawal',sans-serif;}
  .result-card .result-label{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:26px;
  }
  .breakdown{
    text-align:right;
    border-top:1px solid var(--line);
    margin-bottom:24px;
  }
  .bk-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:11px 2px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .bk-row .bk-name{color:var(--ink);}
  .bk-row .bk-val{color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none;}
  .result-actions{display:flex;gap:12px;justify-content:center;}

  .hidden{display:none !important;}

  footer{
    margin-top:36px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:480px){
    .setup-card, .q-card, .result-card{padding:22px 18px;}
  }
</style>
</head>
<body>

<div class="brand">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
      <path d="M7.8 7.8a6 6 0 000 8.4M16.2 7.8a6 6 0 010 8.4M4.6 4.6a10.6 10.6 0 000 14.8M19.4 4.6a10.6 10.6 0 010 14.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span>اختبار تفاعلي</span>
  </div>
  <h1>مبادئ الاتصال الإنساني</h1>
  <p>٢٠٠ سؤال عبر فصول المقرر — اختر ما تريد مراجعته وابدأ</p>
</div>

<div class="stage">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="setup-card">
    <h2>اختر الفصول</h2>
    <p class="hint">حدد فصلاً واحداً أو أكثر، أو اترك الكل محدداً لخوض الاختبار الشامل</p>
    <div id="chapter-list" class="chapter-list"></div>
    <div class="setup-actions">
      <span id="count-note" class="count-note">٢٠٠ سؤال محدد</span>
      <button id="start-btn" class="btn">ابدأ الاختبار</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-head">
      <span id="q-position">السؤال ١ من ٢٠٠</span>
      <span id="q-score">الصحيح: ٠</span>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <div class="q-card">
      <div class="q-topline">
        <div id="q-chapter" class="q-chapter"></div>
        <button id="hint-btn" class="hint-btn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.5.36.8.95.8 1.6v.5h5.4v-.5c0-.65.3-1.24.8-1.6A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="hint-label">تلميح</span>
        </button>
      </div>
      <p id="q-text" class="q-text"></p>
      <div id="options" class="options"></div>
      <p id="hint-note" class="hint-note"></p>
      <div id="feedback" class="feedback"></div>
      <div class="q-foot">
        <button id="prev-btn" class="btn btn-ghost" disabled>السابق</button>
        <button id="next-btn" class="btn next-btn">التالي</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="hidden result-card">
    <div class="big-score"><span id="result-pct">٠٪</span></div>
    <div class="result-label" id="result-label"></div>
    <div id="breakdown" class="breakdown"></div>
    <div class="result-actions">
      <button id="retry-btn" class="btn">إعادة نفس الاختيار</button>
      <button id="home-btn" class="btn btn-ghost">اختيار فصول أخرى</button>
    </div>
  </div>

</div>

<footer>تُعرض الأسئلة بترتيب عشوائي في كل محاولة</footer>

const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabicNum(n){
  return String(n).replace(/[0-9]/g, d => arabicDigits[d]);
}

// Build ordered unique chapter list, preserving first-seen order
const chapters = [];
QUIZ_DATA.forEach(q => { if(!chapters.includes(q.chapter)) chapters.push(q.chapter); });

const chapterCounts = {};
chapters.forEach(c => chapterCounts[c] = QUIZ_DATA.filter(q => q.chapter === c).length);

let selectedChapters = new Set(chapters);
let sessionQuestions = [];
let sessionOptionOrder = [];   // fixed shuffled options per question index
let sessionState = [];         // per-question: {chosen, correct, hintRemoved, hintUsed} or null
let currentIndex = 0;

const chapterListEl = document.getElementById('chapter-list');
const countNoteEl = document.getElementById('count-note');
const startBtn = document.getElementById('start-btn');

function renderChapterList(){
  chapterListEl.innerHTML = '';
  chapters.forEach(ch => {
    const row = document.createElement('div');
    row.className = 'chapter-item checked';
    row.innerHTML = `
      <span class="ch-check"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="ch-name">${ch}</span>
      <span class="ch-count">${toArabicNum(chapterCounts[ch])} سؤال</span>
    `;
    row.addEventListener('click', () => {
      if(selectedChapters.has(ch)){
        selectedChapters.delete(ch);
        row.classList.remove('checked');
      } else {
        selectedChapters.add(ch);
        row.classList.add('checked');
      }
      updateCountNote();
    });
    chapterListEl.appendChild(row);
  });
  updateCountNote();
}

function updateCountNote(){
  const total = chapters.reduce((sum,c) => selectedChapters.has(c) ? sum + chapterCounts[c] : sum, 0);
  countNoteEl.textContent = `${toArabicNum(total)} سؤال محدد`;
  startBtn.disabled = total === 0;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function beginSession(questions){
  sessionQuestions = questions;
  sessionOptionOrder = sessionQuestions.map(q => shuffle(q.options));
  sessionState = sessionQuestions.map(() => null);
  currentIndex = 0;
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  showQuestion();
}

startBtn.addEventListener('click', () => {
  beginSession(shuffle(QUIZ_DATA.filter(q => selectedChapters.has(q.chapter))));
});

const qPosition = document.getElementById('q-position');
const qScore = document.getElementById('q-score');
const progressFill = document.getElementById('progress-fill');
const qChapter = document.getElementById('q-chapter');
const qText = document.getElementById('q-text');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const prevBtn = document.getElementById('prev-btn');
const hintBtn = document.getElementById('hint-btn');
const hintNote = document.getElementById('hint-note');

function currentScore(){
  return sessionState.filter(s => s && s.correct).length;
}

function showQuestion(){
  const q = sessionQuestions[currentIndex];
  const state = sessionState[currentIndex];

  qPosition.textContent = `السؤال ${toArabicNum(currentIndex + 1)} من ${toArabicNum(sessionQuestions.length)}`;
  qScore.textContent = `الصحيح: ${toArabicNum(currentScore())}`;
  progressFill.style.width = (currentIndex / sessionQuestions.length * 100) + '%';
  qChapter.textContent = q.chapter;
  qText.textContent = q.question;

  prevBtn.disabled = currentIndex === 0;

  const letters = ['أ','ب','ج','د','هـ','و'];
  optionsEl.innerHTML = '';
  sessionOptionOrder[currentIndex].forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.value = opt;
    div.innerHTML = `<span class="bullet">${letters[i] || (i+1)}</span><span>${opt}</span>`;
    div.addEventListener('click', () => selectOption(div, opt, q));
    optionsEl.appendChild(div);
  });

  feedbackEl.className = 'feedback';
  feedbackEl.textContent = '';
  hintNote.className = 'hint-note';
  hintNote.textContent = '';
  nextBtn.classList.remove('show');
  hintBtn.disabled = false;
  hintBtn.classList.remove('hidden');

  if(state && state.hintUsed){
    applyHintVisual(state.hintRemoved);
  }

  if(state && state.chosen){
    // question already answered before — restore locked view
    lockOptions(q, state.chosen);
    hintBtn.disabled = true;
    nextBtn.classList.add('show');
    nextBtn.textContent = currentIndex === sessionQuestions.length - 1 ? 'عرض النتيجة' : 'التالي';
  }
}

function applyHintVisual(removedValue){
  const optDivs = [...optionsEl.children];
  optDivs.forEach(child => {
    if(child.dataset.value === removedValue){
      child.classList.add('locked', 'dim');
      child.style.pointerEvents = 'none';
    }
  });
  hintNote.className = 'hint-note show';
  hintNote.textContent = 'تم استبعاد إجابة خاطئة واحدة';
  hintBtn.disabled = true;
}

hintBtn.addEventListener('click', () => {
  const q = sessionQuestions[currentIndex];
  if(sessionState[currentIndex] && sessionState[currentIndex].chosen) return;

  const wrongDivs = [...optionsEl.children].filter(d => d.dataset.value !== q.answer);
  if(wrongDivs.length < 2) return; // keep at least 2 options total
  const pick = wrongDivs[Math.floor(Math.random() * wrongDivs.length)];

  sessionState[currentIndex] = sessionState[currentIndex] || {chosen:null, correct:false};
  sessionState[currentIndex].hintUsed = true;
  sessionState[currentIndex].hintRemoved = pick.dataset.value;

  applyHintVisual(pick.dataset.value);
});

function lockOptions(q, chosen){
  [...optionsEl.children].forEach(child => {
    child.classList.add('locked', 'dim');
    child.style.pointerEvents = 'none';
    if(child.dataset.value === q.answer){
      child.classList.remove('dim');
      child.classList.add('correct');
    }
    if(child.dataset.value === chosen && chosen !== q.answer){
      child.classList.remove('dim');
      child.classList.add('wrong');
    }
  });
  const isCorrect = chosen === q.answer;
  feedbackEl.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
  feedbackEl.textContent = isCorrect ? '✓ إجابة صحيحة' : `✗ إجابة خاطئة — الصحيحة: ${q.answer}`;
}

function selectOption(div, chosen, q){
  if(sessionState[currentIndex] && sessionState[currentIndex].chosen) return;

  const isCorrect = chosen === q.answer;
  const prior = sessionState[currentIndex] || {};
  sessionState[currentIndex] = {
    chosen: chosen,
    correct: isCorrect,
    hintUsed: prior.hintUsed || false,
    hintRemoved: prior.hintRemoved || null
  };

  lockOptions(q, chosen);
  hintBtn.disabled = true;
  qScore.textContent = `الصحيح: ${toArabicNum(currentScore())}`;
  nextBtn.classList.add('show');
  nextBtn.textContent = currentIndex === sessionQuestions.length - 1 ? 'عرض النتيجة' : 'التالي';
}

prevBtn.addEventListener('click', () => {
  if(currentIndex > 0){
    currentIndex -= 1;
    showQuestion();
  }
});

nextBtn.addEventListener('click', () => {
  if(currentIndex < sessionQuestions.length - 1){
    currentIndex += 1;
    showQuestion();
  } else {
    progressFill.style.width = '100%';
    showResult();
  }
});

function showResult(){
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const answeredCount = sessionState.filter(s => s && s.chosen).length || sessionQuestions.length;
  const score = currentScore();
  const pct = Math.round((score / sessionQuestions.length) * 100);
  document.getElementById('result-pct').innerHTML = `${toArabicNum(pct)}<span>٪</span>`;
  document.getElementById('result-label').textContent =
    `أجبت بشكل صحيح على ${toArabicNum(score)} من ${toArabicNum(sessionQuestions.length)} سؤالاً`;

  const chapterStats = {};
  sessionQuestions.forEach((q, i) => {
    const s = sessionState[i];
    if(!chapterStats[q.chapter]) chapterStats[q.chapter] = {correct:0, total:0};
    chapterStats[q.chapter].total += 1;
    if(s && s.correct) chapterStats[q.chapter].correct += 1;
  });

  const breakdownEl = document.getElementById('breakdown');
  breakdownEl.innerHTML = '';
  Object.keys(chapterStats).forEach(ch => {
    const s = chapterStats[ch];
    const row = document.createElement('div');
    row.className = 'bk-row';
    row.innerHTML = `<span class="bk-name">${ch}</span><span class="bk-val">${toArabicNum(s.correct)} / ${toArabicNum(s.total)}</span>`;
    breakdownEl.appendChild(row);
  });
}

document.getElementById('retry-btn').addEventListener('click', () => {
  beginSession(shuffle(sessionQuestions));
});

document.getElementById('home-btn').addEventListener('click', () => {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
});

renderChapterList();
</script>
